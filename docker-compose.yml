services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcu_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcu_app_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rcu_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcu_app} -d ${POSTGRES_DB:-rcu_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rcu_app}:${POSTGRES_PASSWORD:-rcu_app_dev}@db:5432/${POSTGRES_DB:-rcu_app}
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-for-prod}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source over the image's /app
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/my-react-app:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
