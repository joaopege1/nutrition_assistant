services:
  # Backend API — built from backend/Dockerfile
  - type: web
    name: rcu-app-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # DATABASE_URL: set manually in the Render dashboard with the Neon
      # connection string (postgresql://user:pass@host/db?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # SECRET_KEY: set manually in the Render dashboard. Generate with:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false
      # FRONTEND_URL: set to your Vercel deployment URL once it's live.
      - key: FRONTEND_URL
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
